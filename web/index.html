<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="icon" type="image/svg+xml" href="/tracer-watch/favicon.svg" />
    <title>Tracer Watch</title>
    <script>
      // Follow the system theme before first paint, so there is no flash
      (function () {
        var m = window.matchMedia('(prefers-color-scheme: dark)')
        var set = function () { document.documentElement.classList.toggle('dark', m.matches) }
        set(); m.addEventListener('change', set)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
