name: watch

on:
  # Main trigger: cron-job.org dispatches this workflow through the GitHub API every 5 minutes.
  # The web page dispatches it too, to store a note.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Send nothing, print what would be sent (all lots, sold ones included)"
        type: boolean
        default: false
      scan:
        description: "Check the sites now instead of waiting for SCAN_EVERY_MIN"
        type: boolean
        default: false
      note_key:
        description: "Store a note on this bike (frame number or lot key) instead of a pass"
        type: string
        default: ""
      note_tag:
        description: "Note tag: seen, price, repair, mileage, like, or delete"
        type: string
        default: ""
      note_text:
        description: "Note text (the note id for delete)"
        type: string
        default: ""
      note_lot:
        description: "Key of the lot the note was left on"
        type: string
        default: ""
  # Fallback in case cron-job.org goes quiet. GitHub runs schedules late and disables them
  # after 60 days without commits, so this cannot be the main trigger.
  schedule:
    - cron: "7,37 * * * *"

# Two runs at once would read the same state and send the same lots
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # The database and the web page data live on a separate state branch, away from main
      - uses: actions/checkout@v5
        with:
          ref: state
          path: .state

      - name: Run
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DB_FILE: .state/tracer.db
          STATE_FILE: .state/state.json
          # Criteria can be changed in Settings → Secrets and variables → Actions → Variables
          MIN_YEAR: ${{ vars.MIN_YEAR }}
          MIN_RANK: ${{ vars.MIN_RANK }}
          LIMIT_JPY: ${{ vars.LIMIT_JPY }}
          TOP_RANK: ${{ vars.TOP_RANK }}
          TOP_LIMIT_JPY: ${{ vars.TOP_LIMIT_JPY }}
          EXPECT_RATIO: ${{ vars.EXPECT_RATIO }}
          NEAR_RATIO: ${{ vars.NEAR_RATIO }}
          MODEL_PATTERN: ${{ vars.MODEL_PATTERN }}
          SCAN_EVERY_MIN: ${{ vars.SCAN_EVERY_MIN }}
          FRAMES: ${{ vars.FRAMES }}
          DIGEST_HOUR: ${{ vars.DIGEST_HOUR }}
          TZ_OFFSET_HOURS: ${{ vars.TZ_OFFSET_HOURS }}
          # Inputs go through the environment, never straight into the script
          DRY_RUN: ${{ inputs.dry_run }}
          SCAN: ${{ inputs.scan }}
          NOTE_KEY: ${{ inputs.note_key }}
          NOTE_TAG: ${{ inputs.note_tag }}
          NOTE_TEXT: ${{ inputs.note_text }}
          NOTE_LOT: ${{ inputs.note_lot }}
        run: |
          if [ -n "$NOTE_KEY" ]; then
            # --opt=value, so a note text starting with "-" is not taken for an option
            python3 -m bot --note="$NOTE_KEY" --tag="$NOTE_TAG" --text="$NOTE_TEXT" --lot="$NOTE_LOT" --source=web
          elif [ "$DRY_RUN" = "true" ]; then
            python3 -m bot --dry-run --all
          elif [ "$SCAN" = "true" ]; then
            python3 -m bot --scan
          else
            python3 -m bot
          fi

      # The branch is pushed as a single fresh commit, so old copies of the database do not pile
      # up in git history. The previous version is kept on state-prev, to roll back a bad run:
      #   git push -f origin origin/state-prev:state
      - name: Save state
        if: always()
        working-directory: .state
        run: |
          # once the database exists, the old JSON state is history
          if [ -f tracer.db ] && [ -f state.json ]; then git rm -q state.json; fi
          git add -A
          git diff --cached --quiet && exit 0
          git push -q -f origin HEAD:state-prev
          git checkout -q --orphan fresh
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update state"
          git push -q -f origin HEAD:state
